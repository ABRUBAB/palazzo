<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Palazzo Verena Firenze animated architectural banner">
  <defs>
    <linearGradient id="cypressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14211B"/>
      <stop offset="52%" stop-color="#1F3028"/>
      <stop offset="100%" stop-color="#1A1715"/>
    </linearGradient>

    <radialGradient id="amberHalo" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#D9B87E" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#9E543D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1F3028" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="brassShimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#B8935A" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#F4DFB8" stop-opacity="0.98"/>
      <stop offset="55%" stop-color="#D9B87E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B8935A" stop-opacity="0.35"/>
      <animate attributeName="x1" values="-100%;100%" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;200%" dur="4.8s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="stoneGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#D9B87E" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Deep Tuscan Cypress Architectural Canvas -->
  <rect width="1200" height="360" rx="18" fill="url(#cypressGrad)"/>
  <rect width="1200" height="360" rx="18" fill="url(#stoneGrid)"/>

  <!-- Animated Warm Brass Ambient Halo -->
  <ellipse cx="600" cy="175" rx="440" ry="155" fill="url(#amberHalo)">
    <animate attributeName="rx" values="410;470;410" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.82;1;0.82" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Decorative Architectural Arches (Left & Right Florentine Loggia) -->
  <g stroke="#B8935A" stroke-opacity="0.16" fill="none" stroke-width="1.2">
    <path d="M 88 330 V 145 C 88 92 162 92 162 145 V 330"/>
    <path d="M 188 330 V 165 C 188 122 246 122 246 165 V 330"/>
    <path d="M 1038 330 V 145 C 1038 92 1112 92 1112 145 V 330"/>
    <path d="M 954 330 V 165 C 954 122 1012 122 1012 165 V 330"/>
  </g>

  <!-- Outer & Inner Brushed Brass Borders -->
  <rect x="18" y="18" width="1164" height="324" rx="12" fill="none" stroke="url(#brassShimmer)" stroke-width="1.6"/>
  <rect x="28" y="28" width="1144" height="304" rx="8" fill="none" stroke="#B8935A" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Top Coordinates & Live Indicator -->
  <g transform="translate(600, 62)">
    <circle cx="-168" cy="-4" r="4" fill="#9E543D">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#D9B87E">
      VIA DELLA SPADA 14 · 50123 FIRENZE, ITALY
    </text>
  </g>

  <!-- Center Renaissance Arch Emblem -->
  <g transform="translate(600, 128)">
    <rect x="-26" y="-26" width="52" height="52" rx="12" fill="#14211B" stroke="url(#brassShimmer)" stroke-width="1.6"/>
    <path d="M -12 16 V -1 C -12 -8.5 -6.5 -13 0 -13 C 6.5 -13 12 -8.5 12 -1 V 16" fill="none" stroke="#D9B87E" stroke-width="2" stroke-linecap="round"/>
    <path d="M -6.5 16 V 0 C -6.5 -4.2 -3.6 -7 0 -7 C 3.6 -7 6.5 -4.2 6.5 0 V 16" fill="none" stroke="#F7F3EC" stroke-opacity="0.88" stroke-width="1.4"/>
    <line x1="-15" y1="16" x2="15" y2="16" stroke="#D9B87E" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Main Wordmark & Editorial Italic Tagline -->
  <text x="600" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="400" letter-spacing="2.5" fill="#FAF7F2">
    PALAZZO VERENA
  </text>

  <text x="600" y="248" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" fill="#D9B87E">
    A Florentine Sanctuary of Stone &amp; Light · Est. 1548
  </text>

  <!-- Animated Horizontal Shimmer Divider -->
  <line x1="360" y1="274" x2="840" y2="274" stroke="url(#brassShimmer)" stroke-width="1.5"/>

  <!-- Bottom Feature Pill Strip -->
  <g transform="translate(600, 304)">
    <rect x="-285" y="-16" width="570" height="28" rx="14" fill="#14211B" fill-opacity="0.86" stroke="#B8935A" stroke-opacity="0.45" stroke-width="1"/>
    <text x="0" y="2" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2.2" fill="#EDE6DA">
      4 HISTORIC FLOORS  ·  14 SUITES  ·  EN | IT | FR | DE  ·  EUR €
    </text>
  </g>
</svg>
